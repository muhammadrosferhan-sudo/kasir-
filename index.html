<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aplikasi Kasir</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="auth">
    <div class="hero">
      <div>
        <h1 id="hn">Penjualan tercatat rapi, setiap hari.</h1>
        <p>Kelola produk, stok, dan transaksi kasir dalam satu aplikasi.</p>
      </div>
      <div class="slip">
        <div><span>Kopi susu</span><span>2 x 22.000</span></div>
        <div><span>Roti bakar</span><span>1 x 18.000</span></div>
        <div><span>Total</span><b>Rp62.000</b></div>
      </div>
    </div>
    <div class="pane">
      <div class="box" id="abox"></div>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <main class="left">
      <div class="print-only" id="repPrintHeader"></div>
      <header>
        <div class="brand"><span id="sn"></span><small id="clock"></small></div>
        <div class="tabs" id="tabs"></div>
        <div class="me"><span id="who"></span><button onclick="openMyPw()" title="Ganti kata sandi akun Anda">Ganti
            Sandi</button><button onclick="logout()">Keluar</button></div>
      </header>
      <div id="kv" style="display:contents">
        <div class="tools">
          <div class="cat-bar-wrap">
            <div class="chips" id="chips"></div>
          </div>
          <div class="search-row">
            <div class="search-box">
              <span class="search-ico">🔍</span>
              <input id="q" type="search" placeholder="Cari nama produk atau kategori..." oninput="onSearch(this.value)">
              <button id="q-clear" class="search-clear" onclick="clearSearch()" hidden title="Hapus pencarian">✕</button>
            </div>
            <div class="quick-filters">
              <button id="btn-stok-filter" class="q-btn" onclick="toggleStockFilter()">Semua Stok</button>
              <button class="q-btn" onclick="showAllProductsDirectly()">Lihat Semua</button>
            </div>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="view" id="pv" hidden></div>
      <div class="view" id="lv" hidden></div>
      <div class="view" id="hv" hidden></div>
      <div class="view" id="sv" hidden></div>
    </main>
    <aside id="rcw">
      <div class="rc">
        <div class="rchead"><button class="x" onclick="cartOpen(false)">Tutup</button><b id="rs"></b><span
            id="rno"></span><span id="rby"></span></div>
        <div class="lines" id="lines"></div>
        <div class="rtot" id="tot"></div>
        <div class="ract"><button class="ghost" onclick="clearCart()">Kosongkan</button><button class="primary"
            id="payb" onclick="openPay()">Bayar</button></div>
      </div>
    </aside>
  </div>
  <button id="bar" onclick="cartOpen(true)" hidden><span id="bn"></span><span id="bt"></span></button>
  <div id="modal" hidden></div>

  <script src="app.js"></script>
</body>

</html>
